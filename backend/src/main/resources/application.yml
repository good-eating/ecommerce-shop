# Spring Boot 应用配置
spring:
  application:
    name: ecommerce-shop
  
  # 开发环境配置
  profiles:
    active: dev
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/ecommerce?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false
    username: ecommerce
    password: ecommerce123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0
    timeout: 3000ms
  
  # 邮件配置
  mail:
    host: smtp.qq.com
    username: 2985917370@qq.com
    password: zckxrhsgrwysdhbh
    protocol: smtp
    port: 465
    properties:
      mail:
        from: 2985917370@qq.com
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  
  # 异步配置
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: async-
  
  # 定时任务配置
  scheduling:
    pool:
      size: 5

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT配置
jwt:
  secret: ecommerce-shop-secret-key-2024-spring-boot-3-x
  expiration: 86400 # 24小时
  refresh-expiration: 604800 # 7天
  issuer: ecommerce-shop

# 应用配置
app:
  # 文件上传配置
  upload:
    max-file-size: 10MB
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx

# 文件上传存储配置
file:
  upload-dir: uploads
  access-url: /uploads
  
  # 缓存配置
  cache:
    product-ttl: 3600 # 商品缓存1小时
    user-ttl: 1800 # 用户缓存30分钟
    cart-ttl: 2592000 # 购物车缓存30天
  
  # 推荐系统配置
  recommendation:
    similarity-threshold: 0.3
    max-recommendations: 20
    cold-start-items: 10
  
  # 订单配置
  order:
    auto-cancel-minutes: 30 # 30分钟未支付自动取消
    max-items-per-order: 50 # 单订单最大商品数

# 日志配置
logging:
  level:
    com.ecommerce: debug
    org.springframework.security: warn
    org.springframework.aop: info
  file:
    name: logs/ecommerce.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 10MB
  forward-headers-strategy: framework

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
  redis:
    database: 1

---
# 生产环境配置（Docker Compose 部署用）
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://mysql:3306/ecommerce?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ecommerce
    password: ecommerce123
  redis:
    host: redis
    port: 6379
    password:

# 生产环境日志级别
logging:
  level:
    com.ecommerce: info
    org.springframework: warn